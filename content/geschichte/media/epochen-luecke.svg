<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-label="Zeitstrahl mit vier Epochen und drei Übergängen">
<!-- epochen-luecke: Aufbau wie im Test. Epochen epoche-1 bis 4, Übergänge uebergang-1 bis 3. Namen und Jahreszahlen stehen nur im „Merke“. -->
<rect class="bg" x="0" y="0" width="700" height="250"/>
<path class="leader" d="M8 115H38" stroke-dasharray="7 6"/>
<rect id="epoche-1" class="area land" style="--c:#8D6E63" x="40" y="90" width="140" height="50"/>
<rect id="epoche-2" class="area land" style="--c:#F0A30A" x="180" y="90" width="240" height="50"/>
<rect id="epoche-3" class="area land" style="--c:#2E86DE" x="420" y="90" width="130" height="50"/>
<path id="epoche-4" class="area land" style="--c:#2EAD6B" d="M550 90H662L692 115L662 140H550Z"/>
<path class="leader" d="M180 80V166M420 80V166M550 80V204"/>
<g id="uebergang-1" class="area"><rect class="slot" x="108" y="166" width="144" height="36" rx="10"/></g>
<g id="uebergang-2" class="area"><rect class="slot" x="348" y="166" width="144" height="36" rx="10"/></g>
<g id="uebergang-3" class="area"><rect class="slot" x="478" y="204" width="144" height="36" rx="10"/></g>
<text class="tick" x="662" y="192">heute</text>
<g class="labels">
<text x="110" y="70" style="font-size:22px">Frühgeschichte</text>
<text x="300" y="70" style="font-size:22px">Antike</text>
<text x="485" y="70" style="font-size:22px">Mittelalter</text>
<text x="620" y="70" style="font-size:22px">Neuzeit</text>
<text x="180" y="192" style="font-size:19px">ca. 3000 v. Chr.</text>
<text x="420" y="192" style="font-size:19px">ca. 500 n. Chr.</text>
<text x="550" y="230" style="font-size:19px">ca. 1500 n. Chr.</text>
</g>
</svg>
