<polygon class="star" points="250,70 272,228 430,250 272,272 250,430 228,272 70,250 228,228"/>
<circle class="hub" cx="250" cy="250" r="9"/>
<circle id="n" class="area dir" style="--c:#7FB8E8" cx="250" cy="35" r="28"/>
<circle id="no" class="area dir" style="--c:#9AD3A8" cx="384" cy="116" r="28"/>
<circle id="o" class="area dir" style="--c:#F7D07A" cx="465" cy="250" r="28"/>
<circle id="so" class="area dir" style="--c:#F5A97F" cx="384" cy="384" r="28"/>
