<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Wo ist der Ball?">
<!-- prepositions: die Skizzen aus dem Heft (Kiste und Ball). Wörter stehen nur im „Merke“. -->
<rect class="bg" x="0" y="0" width="720" height="430"/>
<g id="p-in" class="area"><rect class="slot" x="6" y="12" width="168" height="196" rx="14"/><rect x="45" y="67" width="90" height="70" rx="4" style="fill:var(--map-land);stroke:var(--ink-2);stroke-width:3"/><circle cx="90" cy="102" r="19" style="fill:#E8833A;stroke:var(--ink-2);stroke-width:3"/></g>
<g id="p-on" class="area"><rect class="slot" x="186" y="12" width="168" height="196" rx="14"/><rect x="225" y="92" width="90" height="70" rx="4" style="fill:var(--map-land);stroke:var(--ink-2);stroke-width:3"/><circle cx="270" cy="73" r="19" style="fill:#E8833A;stroke:var(--ink-2);stroke-width:3"/></g>
<g id="p-under" class="area"><rect class="slot" x="366" y="12" width="168" height="196" rx="14"/><rect x="405" y="32" width="90" height="70" rx="4" style="fill:var(--map-land);stroke:var(--ink-2);stroke-width:3"/><circle cx="450" cy="130" r="19" style="fill:#E8833A;stroke:var(--ink-2);stroke-width:3"/></g>
<g id="p-next-to" class="area"><rect class="slot" x="546" y="12" width="168" height="196" rx="14"/><rect x="565" y="67" width="90" height="70" rx="4" style="fill:var(--map-land);stroke:var(--ink-2);stroke-width:3"/><circle cx="690" cy="118" r="19" style="fill:#E8833A;stroke:var(--ink-2);stroke-width:3"/></g>
<g id="p-in-front-of" class="area"><rect class="slot" x="96" y="222" width="168" height="196" rx="14"/><rect x="135" y="267" width="90" height="70" rx="4" style="fill:var(--map-land);stroke:var(--ink-2);stroke-width:3"/><circle cx="180" cy="328" r="19" style="fill:#E8833A;stroke:var(--ink-2);stroke-width:3"/></g>
<g id="p-behind" class="area"><rect class="slot" x="276" y="222" width="168" height="196" rx="14"/><circle cx="405" cy="267" r="19" style="fill:#E8833A;stroke:var(--ink-2);stroke-width:3"/><rect x="315" y="267" width="90" height="70" rx="4" style="fill:var(--map-land);stroke:var(--ink-2);stroke-width:3"/></g>
<g id="p-between" class="area"><rect class="slot" x="456" y="222" width="168" height="196" rx="14"/><rect x="468" y="277" width="50" height="70" rx="4" style="fill:var(--map-land);stroke:var(--ink-2);stroke-width:3"/><circle cx="540" cy="328" r="19" style="fill:#E8833A;stroke:var(--ink-2);stroke-width:3"/><rect x="562" y="277" width="50" height="70" rx="4" style="fill:var(--map-land);stroke:var(--ink-2);stroke-width:3"/></g>
<g class="labels">
<text x="90" y="194" style="font-size:24px">in</text>
<text x="270" y="194" style="font-size:24px">on</text>
<text x="450" y="194" style="font-size:24px">under</text>
<text x="630" y="194" style="font-size:24px">next to</text>
<text x="180" y="404" style="font-size:24px">in front of</text>
<text x="360" y="404" style="font-size:24px">behind</text>
<text x="540" y="404" style="font-size:24px">between</text>
</g>
</svg>
