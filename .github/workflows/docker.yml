# Baut das Docker-Image und veröffentlicht es in der GitHub Container Registry.
# - Push auf main: Image wird als :latest (und mit dem Commit-Kürzel) veröffentlicht.
#   Unraid erkennt das als Update („update ready“).
# - Pull Request / Branch: Image wird nur gebaut und getestet, nicht veröffentlicht.
name: Docker-Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nilsgaertner/lernwelt

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Inhalte prüfen
        run: |
          npm ci
          npm run check

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lernwelt-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image testen (startet der Server?)
        run: |
          docker run -d --name lernwelt-test -p 8080:8080 lernwelt-test
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/meta > /dev/null; then echo "Server läuft."; exit 0; fi
            sleep 1
          done
          echo "Der Server ist nicht gestartet:"
          docker logs lernwelt-test
          exit 1

      - name: Bei der GitHub Container Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Image veröffentlichen
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
