services:
  lernwelt:
    # Fertiges Image von GitHub. Update: docker compose pull && docker compose up -d
    image: ghcr.io/nilsgaertner/lernwelt:latest
    # Stattdessen selbst bauen: die nächste Zeile einkommentieren und docker compose up -d --build
    # build: .
    container_name: lernwelt
    restart: unless-stopped
    ports:
      - "8080:8080"          # links den Port anpassen, falls 8080 auf dem Server schon belegt ist
    environment:
      - TZ=Europe/Berlin
      - PUID=99              # Besitzer der Dateien im Datenordner (Unraid: nobody)
      - PGID=100             # Gruppe (Unraid: users)
      - PARENT_PIN=1234      # Start-PIN für den Elternbereich (gilt nur beim allerersten Start)
    volumes:
      # Fortschritt, Sterne und Einstellungen – bleiben bei Updates erhalten
      - /mnt/user/appdata/lernwelt/data:/data
      # Eigene Aufgaben: Fach-Ordner nach /mnt/user/appdata/lernwelt/data/aufgaben legen,
      # dann laufen nur diese (Anleitung in LIESMICH.txt dort, danach im Elternbereich
      # „Inhalte neu einlesen“ klicken)
